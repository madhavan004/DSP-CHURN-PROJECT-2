server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Great Expectations Data Docs local site
    location /data-docs {
        alias /usr/share/nginx/html/great_expectations/gx/uncommitted/data_docs/local_site;
        index index.html;
        autoindex on;
    }

    # Direct reports alias
    location /reports {
        alias /usr/share/nginx/html/reports;
        autoindex on;
    }

    # Cache HTML/CSS/JS for short periods (reports change on each DAG run)
    location ~* \.(html|css|js)$ {
        expires 30s;
        add_header Cache-Control "public, max-age=30";
    }
}

