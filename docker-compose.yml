services:
  # =================================================================
  # 1. PostgreSQL Database (Shared for App & Airflow)
  # =================================================================
  postgres:
    image: postgres:15-alpine
    container_name: dsp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dsp_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    networks:
      - dsp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =================================================================
  # 2. FastAPI Model Service API
  # =================================================================
  api:
    build:
      context: ./model_service
      dockerfile: Dockerfile
    container_name: dsp_model_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dsp_app
      MODEL_PATH: /app/model/model.joblib
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_URI: models:/TelecomChurnClassifier@champion
    ports:
      - "8000:8000"
    volumes:
      - ./model_service/model:/app/model
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # =================================================================
  # 3. Streamlit Multi-Page WebApp
  # =================================================================
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: dsp_streamlit_webapp
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dsp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # =================================================================
  # 4. MLflow Tracking Server & Model Registry
  # =================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: dsp_mlflow
    restart: unless-stopped
    environment:
      BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dsp_app
      ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dsp_app
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsp_network

  # =================================================================
  # 5. Apache Airflow 3.x (Init, Webserver, Scheduler)
  # =================================================================
  airflow-init:
    image: apache/airflow:2.10.0-python3.12
    container_name: dsp_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsp_network
    command: version

  airflow-webserver:
    image: apache/airflow:2.10.0-python3.12
    container_name: dsp_airflow_webserver
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/project
      API_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dsp_app
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8085:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./data_docs_reports:/opt/airflow/project/data_docs_reports
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - dsp_network
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.0-python3.12
    container_name: dsp_airflow_scheduler
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/project
      API_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dsp_app
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./data_docs_reports:/opt/airflow/project/data_docs_reports
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - dsp_network
    command: scheduler

  # =================================================================
  # 6. Nginx (Serving Great Expectations Data Docs HTML Reports)
  # =================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dsp_nginx_datadocs
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data_docs_reports:/usr/share/nginx/html/reports:ro
    networks:
      - dsp_network

  # =================================================================
  # 7. Grafana Monitoring Dashboards & Alerts
  # =================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: dsp_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TEAMS_DATA_QUALITY_WEBHOOK_URL: ${TEAMS_DATA_QUALITY_WEBHOOK_URL:-}
      TEAMS_ML_ALERTS_WEBHOOK_URL: ${TEAMS_ML_ALERTS_WEBHOOK_URL:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsp_network

# =================================================================
# Shared Networks & Named Volumes
# =================================================================
networks:
  dsp_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mlflow_artifacts:
    driver: local
  grafana_data:
    driver: local
