
name: CD Pipeline - Automated Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin

          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -n "$EXISTING_TAG" ]; then
            NEW_TAG="$EXISTING_TAG"
            echo "Reusing existing tag: $NEW_TAG"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

            if [ -z "$LATEST_TAG" ]; then
              NEW_TAG="v0.1.0"
            else
              VERSION="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            echo "New release tag: $NEW_TAG"
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        run: |
          git tag "${{ steps.version.outputs.new_tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Automated Production Delivery

            Automated release from the main branch.

            ### Included Components:
            - FastAPI Model Service
            - Streamlit Multi-Page WebApp
            - Airflow 3.x Ingestion, Prediction, and Retraining DAGs
            - Great Expectations v1.x Quality Assurance
            - Grafana Operational and Drift Dashboards
            - PostgreSQL and MLflow Tracking
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
