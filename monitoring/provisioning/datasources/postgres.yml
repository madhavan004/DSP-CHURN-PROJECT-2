apiVersion: 1

datasources:
  - name: PostgreSQL-DSP
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-postgres}
    jsonData:
      database: dsp_app
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
    isDefault: true
    editable: true
